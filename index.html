<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Tracker</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card main-card">

          <!-- Card Header -->
          <div class="card-header-custom">
            <h3 class="fw-bold mb-1"><i class="bi bi-check2-circle me-2"></i>My Tasks</h3>
            <p class="mb-0 opacity-75 small">Manage your daily tasks efficiently</p>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4">

            <!-- Input Form -->
            <form id="taskForm" class="mb-4">
              <div class="input-group">
                <input
                  type="text"
                  id="taskInput"
                  class="form-control"
                  placeholder="Naya task likhein..."
                  aria-label="New task"
                  autocomplete="off"
                  required
                >
                <button class="btn btn-custom px-4" type="submit">
                  <i class="bi bi-plus-lg me-1"></i> Add
                </button>
              </div>
            </form>

            <!-- Task Counter & Controls -->
            <div class="d-flex justify-content-between align-items-center mb-3 text-muted small">
              <span id="taskCount">0 tasks bache hain</span>
              <button id="clearAllBtn" class="btn btn-sm btn-outline-danger border-0 d-none">
                <i class="bi bi-trash3 me-1"></i> Clear All
              </button>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="list-group"></ul>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-4">
              <i class="bi bi-clipboard2-check fs-1 text-muted"></i>
              <p class="text-muted mt-2 mb-0">Koi pending task nahi hai!</p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
